name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Sao_Paulo
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: financeiro
          POSTGRES_PASSWORD: financeiro
          POSTGRES_DB: financeiro_test
          TZ: America/Sao_Paulo
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U financeiro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipagem
        run: npm run check
      - name: Testes da API e da interface
        run: npm test
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
