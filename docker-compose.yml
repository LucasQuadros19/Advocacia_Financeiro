services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: financeiro
      POSTGRES_PASSWORD: financeiro
      POSTGRES_DB: financeiro
      TZ: America/Sao_Paulo
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeiro"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    profiles: ["prod"]
    environment:
      DATABASE_URL: postgres://financeiro:financeiro@db:5432/financeiro
      NODE_ENV: production
      PORT: 3333
      SESSION_SECRET: ${SESSION_SECRET}
      TZ: America/Sao_Paulo
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
